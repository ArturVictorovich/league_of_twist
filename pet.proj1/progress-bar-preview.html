<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attempts Progress Preview</title>
    <style>
      :root {
        --app-bg: #050816;
        --card-bg: #1e293b;
        --card-bg-secondary: #2d3a51;
        --border-card: #334155;
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #f43f5e;
        --cyan: #22d3ee;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--app-bg);
        color: var(--text-primary);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      .preview {
        width: min(920px, 100%);
        display: grid;
        gap: 24px;
      }

      .title {
        margin: 0;
        font-size: 24px;
        line-height: 1.1;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
      }

      .attempts {
        min-height: 116px;
        border: 1px solid var(--border-card);
        border-radius: 24px;
        background: var(--card-bg);
        padding: 16px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 14px;
      }

      .attempts--compact {
        min-height: 76px;
        border-radius: 22px;
        flex-direction: row;
        align-items: center;
      }

      .attempts__top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .attempts__label {
        color: var(--text-secondary);
        font-size: 14px;
        line-height: 1;
      }

      .attempts__value {
        margin-top: 4px;
        font-size: 24px;
        font-weight: 800;
        line-height: 1;
      }

      .attempts__status {
        color: var(--text-muted);
        font-size: 12px;
        line-height: 1.2;
        text-align: right;
      }

      .segments {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 4px;
      }

      .segment {
        height: 10px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.22);
        border: 1px solid rgba(148, 163, 184, 0.14);
      }

      .segment--active {
        background: var(--cyan);
        border-color: rgba(103, 232, 249, 0.7);
        box-shadow: 0 0 12px rgba(34, 211, 238, 0.28);
      }

      .segment--warning {
        background: var(--warning);
        border-color: rgba(251, 191, 36, 0.7);
        box-shadow: 0 0 12px rgba(245, 158, 11, 0.22);
      }

      .segment--danger {
        background: var(--danger);
        border-color: rgba(251, 113, 133, 0.75);
        box-shadow: 0 0 12px rgba(244, 63, 94, 0.22);
      }

      .rail {
        height: 12px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.2);
        border: 1px solid rgba(148, 163, 184, 0.14);
      }

      .rail__fill {
        height: 100%;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--cyan), var(--success));
      }

      .ticks {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .tick {
        width: 9px;
        height: 24px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.22);
      }

      .tick--active {
        background: var(--cyan);
      }

      .tick--warning {
        background: var(--warning);
      }

      .hint {
        margin: 0;
        color: var(--text-muted);
        font-size: 13px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main class="preview">
      <div>
        <h1 class="title">Варианты блока попыток</h1>
        <p class="hint">
          Сегментированная шкала лучше всего подходит для твоего интерфейса:
          она компактная, игровая и сразу показывает давление по попыткам.
        </p>
      </div>

      <section class="grid">
        <article class="attempts">
          <div class="attempts__top">
            <div>
              <div class="attempts__label">Попытки</div>
              <div class="attempts__value">2/10</div>
            </div>
            <div class="attempts__status">Старт раунда</div>
          </div>

          <div class="segments" aria-label="2 из 10 попыток">
            <span class="segment segment--active"></span>
            <span class="segment segment--active"></span>
            <span class="segment"></span>
            <span class="segment"></span>
            <span class="segment"></span>
            <span class="segment"></span>
            <span class="segment"></span>
            <span class="segment"></span>
            <span class="segment"></span>
            <span class="segment"></span>
          </div>
        </article>

        <article class="attempts">
          <div class="attempts__top">
            <div>
              <div class="attempts__label">Попытки</div>
              <div class="attempts__value">6/10</div>
            </div>
            <div class="attempts__status">Нужно сужать круг</div>
          </div>

          <div class="segments" aria-label="6 из 10 попыток">
            <span class="segment segment--warning"></span>
            <span class="segment segment--warning"></span>
            <span class="segment segment--warning"></span>
            <span class="segment segment--warning"></span>
            <span class="segment segment--warning"></span>
            <span class="segment segment--warning"></span>
            <span class="segment"></span>
            <span class="segment"></span>
            <span class="segment"></span>
            <span class="segment"></span>
          </div>
        </article>

        <article class="attempts">
          <div class="attempts__top">
            <div>
              <div class="attempts__label">Попытки</div>
              <div class="attempts__value">9/10</div>
            </div>
            <div class="attempts__status">Последний шанс</div>
          </div>

          <div class="segments" aria-label="9 из 10 попыток">
            <span class="segment segment--danger"></span>
            <span class="segment segment--danger"></span>
            <span class="segment segment--danger"></span>
            <span class="segment segment--danger"></span>
            <span class="segment segment--danger"></span>
            <span class="segment segment--danger"></span>
            <span class="segment segment--danger"></span>
            <span class="segment segment--danger"></span>
            <span class="segment segment--danger"></span>
            <span class="segment"></span>
          </div>
        </article>
      </section>

      <section class="grid">
        <article class="attempts attempts--compact">
          <div>
            <div class="attempts__label">Попытки</div>
            <div class="attempts__value">4/10</div>
          </div>

          <div class="ticks" aria-label="4 из 10 попыток">
            <span class="tick tick--active"></span>
            <span class="tick tick--active"></span>
            <span class="tick tick--active"></span>
            <span class="tick tick--active"></span>
            <span class="tick"></span>
            <span class="tick"></span>
            <span class="tick"></span>
            <span class="tick"></span>
            <span class="tick"></span>
            <span class="tick"></span>
          </div>
        </article>

        <article class="attempts attempts--compact">
          <div>
            <div class="attempts__label">Попытки</div>
            <div class="attempts__value">4/10</div>
          </div>

          <div style="min-width: 142px">
            <div class="rail" aria-label="4 из 10 попыток">
              <div class="rail__fill"></div>
            </div>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
